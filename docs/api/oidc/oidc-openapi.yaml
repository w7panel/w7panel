openapi: 3.0.3
info:
  title: W7Panel OIDC Provider API
  version: 1.0.0
  description: |
    OpenID Connect endpoints exposed by W7Panel.

    This document is intended for direct import into Postman.

    Notes:
    - The OIDC base path is `/panel-api/v1/oidc`.
    - `authorize` is a browser redirect endpoint.
    - `token` uses `application/x-www-form-urlencoded`.
    - Dynamic client registration requires `Authorization: Bearer <registration_access_token>`
      when `oidc.registration_access_token` is configured.
    - When `allow_any_redirect_uri=true`, the client skips `redirect_uris` whitelist checks.
      This rule is consistent for both statically configured clients and dynamically registered clients.
servers:
  - url: http://127.0.0.1:8080/panel-api/v1/oidc
    description: Local example
  - url: https://panel.example.com/panel-api/v1/oidc
    description: Production example
tags:
  - name: Discovery
  - name: Authorization
  - name: Token
  - name: UserInfo
  - name: JWKS
  - name: Dynamic Client Registration
paths:
  /.well-known/openid-configuration:
    get:
      tags: [Discovery]
      summary: Get OIDC discovery metadata
      operationId: getOpenIdConfiguration
      responses:
        '200':
          description: Discovery metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
  /authorize:
    get:
      tags: [Authorization]
      summary: Start authorization code flow
      description: |
        Browser endpoint for the Authorization Code flow.
        On success, redirects to `redirect_uri` with `code` and `state`.
      operationId: authorize
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: openid profile offline_access
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            example: login
      responses:
        '302':
          description: Redirect to login or client callback
        '400':
          $ref: '#/components/responses/OAuthError'
    post:
      tags: [Authorization]
      summary: Start authorization code flow
      description: Same as `GET /authorize`, for clients that submit parameters via form POST.
      operationId: authorizePost
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '302':
          description: Redirect to login or client callback
        '400':
          $ref: '#/components/responses/OAuthError'
  /token:
    post:
      tags: [Token]
      summary: Exchange authorization code or refresh token
      operationId: exchangeToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
                - $ref: '#/components/schemas/RefreshTokenRequest'
              discriminator:
                propertyName: grant_type
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
  /userinfo:
    get:
      tags: [UserInfo]
      summary: Get user claims from access token
      operationId: getUserInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/OAuthError'
  /jwks:
    get:
      tags: [JWKS]
      summary: Get signing public keys
      operationId: getJwks
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
  /register:
    post:
      tags: [Dynamic Client Registration]
      summary: Register dynamic OIDC client
      operationId: registerClient
      security:
        - registrationBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicClientRequest'
      responses:
        '200':
          description: Registered client metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicClientResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /register/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dynamic Client Registration]
      summary: Get dynamic client metadata
      operationId: getClient
      security:
        - registrationBearerAuth: []
      responses:
        '200':
          description: Client metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicClientResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Dynamic Client Registration]
      summary: Update dynamic client metadata
      operationId: updateClient
      security:
        - registrationBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicClientRequest'
      responses:
        '200':
          description: Updated client metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicClientResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Dynamic Client Registration]
      summary: Delete dynamic client
      operationId: deleteClient
      security:
        - registrationBearerAuth: []
      responses:
        '204':
          description: Deleted successfully
        '404':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    registrationBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  responses:
    OAuthError:
      description: OAuth/OIDC error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    ErrorResponse:
      description: Generic error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OpenIDConfiguration:
      type: object
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - jwks_uri
    AuthorizeRequest:
      type: object
      properties:
        response_type:
          type: string
          enum: [code]
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [S256]
        prompt:
          type: string
      required:
        - response_type
        - client_id
        - redirect_uri
        - scope
    AuthorizationCodeTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        code_verifier:
          type: string
      required:
        - grant_type
        - code
        - redirect_uri
    RefreshTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string
        scope:
          type: string
      required:
        - grant_type
        - refresh_token
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        id_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
        scope:
          type: array
          items:
            type: string
      required:
        - access_token
        - id_token
        - token_type
        - expires_in
    UserInfo:
      type: object
      properties:
        sub:
          type: string
        preferred_username:
          type: string
        name:
          type: string
      required:
        - sub
    JWK:
      type: object
      properties:
        kty:
          type: string
        use:
          type: string
        alg:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string
      additionalProperties: true
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
      required:
        - keys
    DynamicClientRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
        grant_types:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          items:
            type: string
            enum: [code]
        scope:
          type: string
          example: openid profile offline_access
        client_name:
          type: string
        require_pkce:
          type: boolean
      required:
        - redirect_uris
    DynamicClientResponse:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_id_issued_at:
          type: integer
          format: int64
        client_secret_expires_at:
          type: integer
          format: int64
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        token_endpoint_auth_method:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        client_name:
          type: string
        require_pkce:
          type: boolean
        registration_client_uri:
          type: string
      required:
        - client_id
        - client_id_issued_at
        - client_secret_expires_at
        - redirect_uris
        - token_endpoint_auth_method
        - grant_types
        - response_types
        - scope
        - require_pkce
    OAuthError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
        state:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
