name: Build Image On Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  KO_DOCKER_REPO: ccr.ccs.tencentyun.com/afan-public/w7panel1
  KO_DEFAULTBASEIMAGE: ccr.ccs.tencentyun.com/afan-public/ubuntu:24.04-offlineui

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup ko
        uses: ko-build/setup-ko@v0.8

      # - name: Login registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ccr.ccs.tencentyun.com
      #     username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
      #     password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build frontend
        working-directory: w7panel-ui
        run: |
          npm install
          npm run build

      - name: Copy frontend assets to backend kodata
        run: |
          mkdir -p w7panel-server/kodata
          cp -a w7panel-ui/dist/. w7panel-server/kodata/

      - name: Build and push image
        working-directory: w7panel-server
        env:
          KO_DOCKER_REPO: ${{ env.KO_DOCKER_REPO }}
          KO_DEFAULTBASEIMAGE: ${{ env.KO_DEFAULTBASEIMAGE }}
          TENCENT_DOCKER_USERNAME: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          TENCENT_DOCKER_PASSWORD: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
        run: |
          ko login ccr.ccs.tencentyun.com -u "${TENCENT_DOCKER_USERNAME}" -p "${TENCENT_DOCKER_PASSWORD}"
          ko build --bare --tags="${GITHUB_REF_NAME}" --tag-only --sbom=none --platform=all
