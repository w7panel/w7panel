{{- $secretName := include "helm.panelAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
type: Opaque
data:
  signing-key: {{ if .Values.panelAuth.signingKey }}{{ .Values.panelAuth.signingKey | b64enc | quote }}{{ else if and $existing (hasKey $existing.data "signing-key") }}{{ index $existing.data "signing-key" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
