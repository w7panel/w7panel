apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}
  annotations:
    {{- include "helm.annotations" . | nindent 4 }}
    w7.cc/title: "微擎面板"
    title: "微擎面板"
    w7.cc/create-svc: 'true'
    {{- include "helm.servicelb.annotations" . | nindent 4 }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }} 
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env: 
          - name: ARTIFACT_ALLOWED_HOSTS
            value: {{ join "," .Values.artifact.allowedHosts | quote }}
          # - name: GOGC
          #   value: "10"
          - name: HELM_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: BUILDIMGAGE_ENABLED
            value: "true"
          - name: RELEASE_NAME_SUFFIX
            value: {{ .Release.Name }} 
          - name: SERVICE_ACCOUNT_NAME
            value: {{ .Release.Name }}   
          - name: APP_WATCH
            value: {{ .Values.controller.appWatch | quote }}  
          - name: HIGRESS_WATCH
            value: "true"     
          - name: W7PANEL_AUTH_MODE
            value: "panel"  
          - name: MCP_K8S_WRITE_ENABLED
            value: {{ .Values.mcp.writeEnabled | quote }}
          - name: PANEL_AUTH_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "helm.panelAuthSecretName" . }}
                key: signing-key
          - name: GPUSTACK_WATCH
            value: {{ .Values.gpustack.watch | quote }}      
          - name: MOCK_UPGRADE
            value: {{ .Values.mock.upgrade | quote }} 
          - name: LONGHORN_WATCH
            value: {{ .Values.longhorn.watch | quote }}     
          - name: DEPLOYMENT_NAME
            value: {{ include "helm.fullname" . }}   
          - name: HELM_VERSION
            value: {{ .Values.image.tag | default .Chart.AppVersion }}
          - name: MICROAPP_PATH
            value: /data/microapp
          - name: SITE_ENABLED
            value: "true"     
          - name: K8S_WATCH
            value: {{ .Values.k8s.watch | quote }}     
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP      
          - name: METADATA_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: SVC_NAME
            value: {{ include "helm.fullname" . }}
          - name: SVC_LB_CLASS
            value: {{ .Values.servicelb.loadBalancerClass | quote }}  
          - name: WEBHOOK_ENABLED
            value: {{ .Values.webhook.enabled | quote }} 
          - name: WEBHOOK_CERT_MANAGER_ENABLED
            value: {{ .Values.webhook.certManager.enabled | quote }}
          - name: WEBHOOK_CERT_MANAGER_CERTIFICATE_NAME
            value: {{ default (printf "%s-webhook-tls" (include "helm.fullname" .)) .Values.webhook.certManager.certificate.name | quote }}
          - name: STATIC_DOWN_ENABLED
            value: {{ .Values.static.downEnabled | quote }} 
          - name: LOG_LEVEL
            value: {{ .Values.log.level | quote }}   
          - name: IMAGE_REPO
            value: {{ .Values.image.repository | quote }}    
          - name: TZ
            value: {{ .Values.timezone | quote }} 
          - name: PRIVATEDNS_ENABLED
            value: {{ .Values.privatedns.enabled | quote }} 
          args:
          - server:start
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.storage.enabled (and .Values.webhook.enabled .Values.webhook.certManager.enabled) }}
          volumeMounts:
          {{- if .Values.storage.enabled }}
          - name: data
            mountPath: /data
            subPath: data
          {{- end }}
          {{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
          - name: webhook-cert
            mountPath: /tmp/k8s-webhook-server/serving-certs
            readOnly: true
          {{- end }}
          {{- end }}    
      {{- if or .Values.storage.enabled (and .Values.webhook.enabled .Values.webhook.certManager.enabled) }}
      volumes:
      {{- if .Values.storage.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "helm.fullname" . }}
      {{- end }}
      {{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
      - name: webhook-cert
        secret:
          secretName: {{ printf "%s-webhook-tls" (include "helm.fullname" .) | quote }}
          optional: false
      {{- end }}
      {{- end }}    
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
