apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "helm.fullname" . }}-{{ .Release.Revision }}-upgrade-{{ randAlpha 5 | lower }}
  annotations:
    {{- include "helm.annotations" . | nindent 4 }}
    title: '[自定义触发]面板更新脚本'
    w7.cc/title: '[自定义触发]面板更新脚本'
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  # The upgrade includes Helm/plugin operations that each allow up to 600s.
  # Keep the Job deadline above the combined migration window.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: registerjob
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.childPanel.enabled }}
          command: ["sh", "-c", "$KO_DATA_PATH/shell/k3k-agent-upgrade.sh"]
          env:
            - name: OIDC_PANEL_LOGIN_ENABLED
              value: {{ .Values.childPanel.oidcLoginEnabled | quote }}
            - name: OIDC_PANEL_LOGIN_DISCOVERY_URL
              value: {{ .Values.childPanel.oidcDiscoveryURL | quote }}
            - name: OIDC_PANEL_LOGIN_CLIENT_ID
              value: {{ .Values.childPanel.oidcClientID | quote }}
            - name: OIDC_PANEL_LOGIN_SCOPES
              value: {{ .Values.childPanel.oidcScopes | quote }}
            - name: DEPLOYMENT_NAME
              value: {{ include "helm.fullname" . | quote }}
          {{- else }}
          command: ["sh", "-c", "$KO_DATA_PATH/shell/upgrade.sh"]
          env:
            - name: RELEASE_NAME_SUFFIX
              value: {{ .Release.Name }}   
            - name: DEPLOYMENT_NAME
              value: {{ include "helm.fullname" . }}    
            - name: NAMESPACE
              value: {{ .Release.Namespace }}     
            - name: HELM_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion }}
            - name: SERVICE_ACCOUNT_NAME
              value: {{ .Release.Name }}     
          {{- end }}
      restartPolicy: Never
  # Do not automatically replay a partially completed destructive migration.
  backoffLimit: 1
