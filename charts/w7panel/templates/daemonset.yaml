{{- if .Values.daemonset.create -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helm.fullname" . }}-agent
  annotations:
    {{- include "helm.annotations" . | nindent 4 }}
    w7.cc/title : "面板代理"
    title : "面板代理"
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "helm.fullname" . }}-agent
  template:
    
    metadata:
      annotations:
        "w7.cc/deny-delete": "true"
      labels:
        app: {{ include "helm.fullname" . }}-agent
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostPID: true
      hostIPC: true
      serviceAccountName: {{ .Release.Name }}
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: ""
      - name: cd-socket
        hostPath:
          # Mount the directory instead of the socket file. containerd recreates
          # its socket on restart; a file mount would keep pointing at the old inode.
          path: /var/run/k3s/containerd
          type: Directory
      # - name: cd-data
      #   hostPath:
      #     path: /var/lib/rancher/k3s/agent/containerd
      #     type: Directory     
      - name: cd-runtime
        hostPath:
          path: {{ .Values.k3s.runtimedir }}
          type: Directory         
      tolerations:
      - 
        operator: Exists
        effect: NoSchedule   
      - key: node.kubernetes.io/storage
        effect: NoSchedule       
      containers:
        - name: k8s-offline-ds
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8000
            protocol: TCP
            name: http
            # readOnly: true
          env: 
          # - name: GOGC
          #   value: "10"
          - name: K3S_SHELL_ENABLED
            value: "true"
          - name: K3S_REGISTRY_ENABLED
            value: "true"     
          - name: IS_AGENT
            value: "true"
          - name: SERVICE_ACCOUNT_NAME
            value: {{ .Release.Name }}
          - name: PANEL_SERVICE_URL
            value: {{ printf "http://%s.%s.svc:8000" (include "helm.fullname" .) .Release.Namespace | quote }}
          - name: PANEL_AUTH_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "helm.panelAuthSecretName" . }}
                key: signing-key
          - name: K3S_RUNTIME_DIR     
            value: {{ .Values.k3s.runtimedir | quote }}
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP  
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP        
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName     
          - name: TZ
            value: {{ .Values.timezone | quote }} 
          args:
            - server:start
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}  
          volumeMounts:
            - name: cd-socket
              mountPath: /var/run/k3s/containerd
            # - name: cd-data
            #   mountPath: /var/lib/rancher/k3s/agent/containerd  
            #   mountPropagation: HostToContainer
            - name: cd-runtime
              mountPath: {{ .Values.k3s.runtimedir | quote }}
              mountPropagation: HostToContainer
            - name: host-root
              mountPath: /host  
{{- end }}
